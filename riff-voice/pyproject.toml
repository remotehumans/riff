# ABOUTME: UV project config for Riff - voice narrator for AI agents.
# ABOUTME: Defines dependencies, CLI entry points, and build settings.

[project]
name = "riff"
version = "0.1.0"
description = "Voice narrator for AI coding agents - hear your agents riff"
readme = "README.md"
authors = [
    { name = "Elliott Callender", email = "elliott@remotehumans.com" }
]
requires-python = ">=3.10"
dependencies = [
    "mlx-audio[tts]",
    "sounddevice",
    "soundfile",
    "numpy",
    "en-core-web-sm",
]

[project.scripts]
riff-say = "riff.cli:say"
riff-ctl = "riff.cli:ctl"
riff-daemon = "riff.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
